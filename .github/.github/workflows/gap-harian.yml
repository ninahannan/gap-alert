name: Harga GAP ke Telegram

on:
  schedule:
    - cron: "*/10 * * * *"   # semak setiap 10 minit
    - cron: "1 16 * * *"     # 16:01 UTC = 12:01 malam waktu Malaysia (update harian)
  workflow_dispatch:          # butang "Run workflow" untuk test manual

permissions:
  contents: write             # supaya boleh simpan last_price.txt & history.csv

concurrency:
  group: gap-alert
  cancel-in-progress: false

jobs:
  semak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests matplotlib numpy
      - run: python gap_price.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
      - name: Simpan harga terakhir
        run: |
          git config user.name "gap-bot"
          git config user.email "gap-bot@users.noreply.github.com"
          for f in last_price.txt history.csv ytd.json last_daily.txt; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet || (git commit -m "Harga GAP berubah" && git push)
